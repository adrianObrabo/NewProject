<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="main">
        <h2 class="title">Meus Objetivos do ano<span>_</span></h2>
        <div class="cluster">


            <div class="buttons">
                <button class="button">Cursos na Alura</button>
                <button class="button">Criar projetos em Javascript</button>
                <button class="button">Criar um portfolio</button>
                <button class="button">Atualizar meu currículo</button>
            </div>
            <div class="container">
                <div class="contet">
                    <h3 class="title-content">Estudar 4 Cursos na Alura</h3>
                    <h4 class="subtitle-content">Tempo para completar objetivo</h4>
                    <div class="timer"></div>
                </div>
                <div class="contet">
                    <h3 class="title-content">Criar 5 Projetos</h3>
                    <h4 class="subtitle-content">Tempo para completar objetivo</h4>
                    <div class="timer"></div>
                </div>
                <div class="contet">
                    <h3 class="title-content">Criar um Portifolio</h3>
                    <h4 class="subtitle-content">Tempo para completar objetivo</h4>
                    <div class="timer"></div>
                </div>
                <div class="contet">
                    <h3 class="title-content">Atualizar Curriculo</h3>
                    <h4 class="subtitle-content">Tempo para completar objetivo</h4>
                    <div class="timer"></div>
                </div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
